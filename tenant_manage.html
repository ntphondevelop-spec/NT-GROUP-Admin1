<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Management - Pak Phanang Prestige Hall</title>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Audiowide&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --font-ui: 'Anuphan', sans-serif;
            --font-logo: 'Audiowide', cursive;
            --bg-dark: #03030A;
            --surface-dark: #0A0A2A;
            --surface-card: #0F0F30;
            --gold-accent: #D4AF37;
            --gold-hover: #E5C354;
            --text-light: #F5F5F7;
            --text-gray: #8E8E93;
            --border-light: rgba(255,255,255,0.1);
            --alert-red: #FF3B30;
            --success-green: #34C759;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-ui); }
        body { background-color: var(--bg-dark); color: var(--text-light); -webkit-font-smoothing: antialiased; min-height: 100vh; padding-bottom: 60px; overflow-x: hidden; }

        /* =========================================
           Topbar
           ========================================= */
        .topbar { background: var(--surface-dark); border-bottom: 1px solid var(--border-light); padding: 16px clamp(20px, 4vw, 40px); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .btn-back { display: flex; align-items: center; gap: 8px; color: var(--text-gray); text-decoration: none; font-weight: 600; transition: 0.2s; font-size: clamp(0.9rem, 2vw, 1rem);}
        .btn-back:hover { color: var(--gold-accent); }
        .btn-back svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.5; fill: none;}
        .brand { font-family: var(--font-logo); color: var(--gold-accent); font-size: clamp(1rem, 3vw, 1.2rem); }

        /* =========================================
           Container & Header
           ========================================= */
        .container { max-width: 1200px; margin: 40px auto 0; padding: 0 clamp(16px, 4vw, 24px); animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .header-title h1 { font-size: clamp(1.8rem, 5vw, 2.2rem); font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.2;}
        .header-title p { color: var(--text-gray); font-size: 0.95rem; }
        
        /* 🚨 แก้ไขปุ่มที่บวมน้ำตรงนี้ ล็อกขนาดให้เป๊ะ! */
        .btn-add { background: var(--gold-accent); color: var(--bg-dark); border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 1.05rem; white-space: nowrap; height: 52px;}
        .btn-add:hover { background: var(--gold-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3); }
        .btn-add svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.5; fill: none; flex-shrink: 0;}

        /* =========================================
           Controls (Search & Filter)
           ========================================= */
        .controls-card { background: var(--surface-card); border: 1px solid var(--border-light); border-radius: 20px; padding: clamp(16px, 4vw, 24px); margin-bottom: 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 200px; position: relative; }
        .search-box input { width: 100%; padding: 16px 20px 16px 48px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-light); border-radius: 14px; color: #fff; outline: none; font-size: 1rem; transition: 0.3s; }
        .search-box input:focus { border-color: var(--gold-accent); }
        .search-box svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; stroke: var(--text-gray); stroke-width: 2; fill: none; }

        .custom-select-wrapper { position: relative; min-width: 200px; flex: 1;}
        select.custom-select { appearance: none; width: 100%; padding: 16px 40px 16px 20px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-light); border-radius: 14px; color: #fff; font-size: 1rem; cursor: pointer; outline: none; }
        select.custom-select:focus { border-color: var(--gold-accent); }
        .select-arrow { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; stroke: var(--gold-accent); stroke-width: 2.5; fill: none; width: 18px; }

        /* =========================================
           Data Table
           ========================================= */
        .table-container { background: var(--surface-card); border: 1px solid var(--border-light); border-radius: 20px; overflow-x: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; min-width: 800px; }
        th { background: rgba(212, 175, 55, 0.08); color: var(--gold-accent); padding: 20px 24px; font-weight: 700; font-size: 0.95rem; text-transform: uppercase; }
        td { padding: 18px 24px; border-bottom: 1px solid var(--border-light); font-weight: 500; font-size: 1rem; }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        
        .room-badge { background: var(--bg-dark); border: 1px solid var(--gold-accent); color: var(--gold-accent); padding: 6px 14px; border-radius: 10px; font-weight: 700; font-family: var(--font-logo); font-size: 1.1rem;}
        .status-pill { padding: 8px 16px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; }
        .status-active { background: rgba(52, 199, 89, 0.1); color: var(--success-green); border: 1px solid rgba(52, 199, 89, 0.2); }
        .status-moved { background: rgba(142, 142, 147, 0.1); color: var(--text-gray); border: 1px solid rgba(142, 142, 147, 0.2); }

        .action-group { display: flex; gap: 8px; }
        .btn-icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border-light); background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .btn-icon:hover { background: var(--gold-accent); color: var(--bg-dark); border-color: var(--gold-accent); }
        .btn-icon.danger:hover { background: var(--alert-red); border-color: var(--alert-red); color: #fff; }
        .btn-icon svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

        /* =========================================
           Custom Confirm Modal
           ========================================= */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; padding: 20px;}
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content.confirm-sm { background: var(--surface-dark); border: 1px solid var(--alert-red); border-radius: 28px; width: 100%; max-width: 400px; padding: 40px 24px; text-align: center; transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .confirm-icon { width: 72px; height: 72px; background: rgba(255, 59, 48, 0.1); border-radius: 50%; color: var(--alert-red); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; }
        .confirm-icon svg { width: 36px; height: 36px; stroke: currentColor; stroke-width: 2.5; fill: none; }
        .btn-cancel { background: transparent; color: var(--text-gray); border: 1px solid var(--border-light); padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer; flex: 1; font-size: 1rem;}
        .btn-save { background: var(--alert-red); color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 700; cursor: pointer; flex: 1; font-size: 1rem;}

        /* =========================================
           Custom Toast
           ========================================= */
        #custom-toast { position: fixed; bottom: 30px; right: 30px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-item { background: var(--surface-dark); border: 1px solid var(--gold-accent); color: #fff; padding: 16px 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; animation: slideIn 0.4s ease forwards; min-width: 280px; font-weight: 600;}
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-item.error { border-color: var(--alert-red); }

        /* 🚨 มือถือ / Tablet */
        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: stretch; text-align: left; gap: 16px; }
            .btn-add { width: 100%; } /* ปุ่มจะกว้างเต็มจอ แต่ความสูงถูกล็อกไว้ที่ 52px แล้ว */
            #custom-toast { bottom: 20px; right: 20px; left: 20px; }
            .toast-item { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="dashboard.html" class="btn-back">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>กลับ
        </a>
        <div class="brand">PAK PHANANG PRESTIGE</div>
    </div>

    <div class="container">
        <div class="page-header">
            <div class="header-title">
                <h1>จัดการลูกบ้าน</h1>
                <p>ศูนย์ควบคุมข้อมูลผู้เช่าทั้งหมด</p>
            </div>
            <!-- ปุ่มลงทะเบียนใหม่ -->
            <a href="tenant_register.html" class="btn-add">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                ลงทะเบียนผู้เช่าใหม่
            </a>
        </div>

        <div class="controls-card">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="ค้นหาเลขห้อง หรือ ชื่อ...">
            </div>
            <div class="custom-select-wrapper">
                <select class="custom-select" id="status-filter">
                    <option value="ALL">สถานะทั้งหมด</option>
                    <option value="ACTIVE">อยู่ปัจจุบัน</option>
                    <option value="MOVED_OUT">ย้ายออกแล้ว</option>
                </select>
                <svg class="select-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>เลขห้อง</th>
                        <th>ชื่อ-นามสกุล</th>
                        <th>เบอร์โทรศัพท์</th>
                        <th>สถานะ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="tenant-table-body">
                    <tr><td colspan="5" style="text-align:center; padding: 60px; color: var(--text-gray);">กำลังโหลดข้อมูลจากระบบ...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Confirm Move Out Modal -->
    <div class="modal-overlay" id="modal-confirm">
        <div class="modal-content confirm-sm">
            <div class="confirm-icon">
                <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            </div>
            <h2 style="margin-bottom: 12px; color: #fff; font-size: 1.6rem;">ยืนยันการแจ้งย้ายออก?</h2>
            <p style="color: var(--text-gray); margin-bottom: 32px; font-size: 1rem;">ลูกบ้านห้อง <strong id="confirm-room-text" style="color:var(--alert-red); font-size: 1.2rem;"></strong> จะถูกเปลี่ยนสถานะเป็น 'ย้ายออกแล้ว' ถาวร</p>
            <div style="display: flex; gap: 16px;">
                <button class="btn-cancel" onclick="closeModal('modal-confirm')">ยกเลิก</button>
                <button class="btn-save" id="btn-confirm-moveout">ยืนยันย้ายออก</button>
            </div>
        </div>
    </div>

    <div id="custom-toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const DB_URL = 'https://vnlqxtxifgchrouongpu.supabase.co';
            const DB_KEY = 'sb_publishable_jBw7w_gyrLx7B0oSHAtWOw_nVTHTzxl'; 
            const db = window.supabase.createClient(DB_URL, DB_KEY);

            let allTenants = [];
            const tbody = document.getElementById('tenant-table-body');

            window.showToast = function(msg, type = 'success') {
                const container = document.getElementById('custom-toast');
                const toast = document.createElement('div');
                toast.className = `toast-item ${type}`;
                const icon = type === 'success' ? 
                    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--success-green)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>` :
                    `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--alert-red)" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
                toast.innerHTML = `${icon} <span>${msg}</span>`;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3000);
            }

            window.closeModal = (id) => document.getElementById(id).classList.remove('active');

            async function fetchTenants() {
                const { data, error } = await db.from('tenant_profiles').select('*').order('room_number');
                if (error) { showToast("ดึงข้อมูลไม่สำเร็จ", "error"); return; }
                allTenants = data || [];
                renderTable(allTenants);
            }

            function renderTable(dataArray) {
                tbody.innerHTML = '';
                if (dataArray.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:60px; color:var(--text-gray);">ไม่พบข้อมูล</td></tr>`;
                    return;
                }
                dataArray.forEach(t => {
                    const statusClass = t.status === 'ACTIVE' ? 'status-active' : 'status-moved';
                    const statusText = t.status === 'ACTIVE' ? 'อยู่ปัจจุบัน' : 'ย้ายออกแล้ว';
                    const row = document.createElement('tr');
                    
                    row.innerHTML = `
                        <td><span class="room-badge">${t.room_number}</span></td>
                        <td>${t.prefix_th || ''}${t.first_name_th} ${t.last_name_th}</td>
                        <td>${t.phone_number}</td>
                        <td><span class="status-pill ${statusClass}">${statusText}</span></td>
                        <td>
                            <div class="action-group">
                                <!-- 🚨 ส่ง edit_id ผ่าน URL ไปหน้า Register (เพื่อแก้ไข) -->
                                <button class="btn-icon" onclick="window.location.href='tenant_register.html?edit_id=${t.id}'" title="แก้ไขข้อมูล">
                                    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </button>
                                ${t.status === 'ACTIVE' ? `
                                <button class="btn-icon danger" onclick="prepareMoveOut('${t.id}', '${t.room_number}')" title="แจ้งย้ายออก">
                                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                                </button>` : ''}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            let selectedIdForMoveOut = null;
            window.prepareMoveOut = function(id, room) {
                selectedIdForMoveOut = id;
                document.getElementById('confirm-room-text').innerText = room;
                document.getElementById('modal-confirm').classList.add('active');
            };

            document.getElementById('btn-confirm-moveout').addEventListener('click', async () => {
                if (!selectedIdForMoveOut) return;
                const btn = document.getElementById('btn-confirm-moveout');
                btn.innerText = "กำลังดำเนินการ..."; btn.disabled = true;

                const { error } = await db.from('tenant_profiles').update({ status: 'MOVED_OUT' }).eq('id', selectedIdForMoveOut);
                if (error) { showToast(error.message, "error"); } 
                else { showToast("แจ้งย้ายออกสำเร็จ"); closeModal('modal-confirm'); fetchTenants(); }
                btn.innerText = "ยืนยันย้ายออก"; btn.disabled = false;
            });

            function filterData() {
                const search = document.getElementById('search-input').value.toLowerCase();
                const status = document.getElementById('status-filter').value;
                const filtered = allTenants.filter(t => {
                    const matchSearch = t.room_number.toLowerCase().includes(search) || t.first_name_th.toLowerCase().includes(search);
                    const matchStatus = status === 'ALL' || t.status === status;
                    return matchSearch && matchStatus;
                });
                renderTable(filtered);
            }

            document.getElementById('search-input').addEventListener('input', filterData);
            document.getElementById('status-filter').addEventListener('change', filterData);

            fetchTenants();
        });
    </script>
</body>
</html>
